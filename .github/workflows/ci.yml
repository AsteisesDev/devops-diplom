name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/asteisesdev/devops-diplom/webapp

jobs:
  # --- Сборка Docker-образа и push в GitHub Container Registry ---
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          TAG=${GITHUB_SHA::7}
          docker build -t $IMAGE:$TAG -t $IMAGE:latest app/
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

  # --- Валидация Helm-чарта ---
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint helm/webapp

      - name: Template Helm chart
        run: helm template webapp helm/webapp --set image.tag=${GITHUB_SHA::7}

  # --- Деплой в Minikube (ручной запуск) ---
  deploy:
    runs-on: self-hosted
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Minikube
        run: |
          TAG=${GITHUB_SHA::7}
          helm upgrade --install webapp helm/webapp \
            --set image.repository=$IMAGE \
            --set image.tag=$TAG \
            --namespace default \
            --wait --timeout 5m
