stages:
  - build
  - test
  - deploy

variables:
  IMAGE: $CI_REGISTRY_IMAGE/webapp
  TAG: $CI_COMMIT_SHORT_SHA

# --- Сборка Docker-образа и push в GitLab Container Registry ---
build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE:$TAG -t $IMAGE:latest app/
    - docker push $IMAGE:$TAG
    - docker push $IMAGE:latest

# --- Валидация Helm-чарта ---
test:
  stage: test
  image:
    name: alpine/helm:3.17
    entrypoint: [""]
  script:
    - helm lint helm/webapp
    - helm template webapp helm/webapp --set image.tag=$TAG

# --- Деплой в Minikube через локальный runner ---
deploy:
  stage: deploy
  tags:
    - local-runner
  environment:
    name: production
  script:
    - helm upgrade --install webapp helm/webapp
        --set image.repository=$IMAGE
        --set image.tag=$TAG
        --namespace default
        --wait --timeout 5m
  when: manual
